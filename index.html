<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1B2A">
<title>Ankara Bölge 1 — Premium Bölge | Motivasyon Çarkı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A141F;
    --panel-a: #122238;
    --panel-b: #17304A;
    --card: #12233A;
    --gold: #C6A15B;
    --gold-light: #E9D8A6;
    --cream: #F3EEE2;
    --muted: #8CA0B3;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: radial-gradient(120% 90% at 50% -10%, #142944 0%, var(--bg) 55%, #060B12 100%);
    color: var(--cream);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page{
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(28px, env(safe-area-inset-top)) 20px 40px;
  }

  header{
    text-align: center;
    max-width: 420px;
    margin-bottom: 6px;
  }

  .badge{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid rgba(198,161,91,0.45);
    background: rgba(198,161,91,0.08);
    color: var(--gold-light);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 14px;
  }
  .badge::before{
    content:"";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px 1px rgba(198,161,91,0.9);
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(32px, 9vw, 42px);
    line-height: 1.08;
    margin: 0 0 8px;
    color: var(--cream);
  }

  .sub{
    margin: 0;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.5;
  }

  main{
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 30px;
  }

  .wheel-wrap{
    position: relative;
    width: min(86vw, 340px);
    aspect-ratio: 1/1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pointer{
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 34px;
    z-index: 5;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.45));
  }
  .pointer svg{ width: 100%; height: 100%; display:block; }

  .wheel-ring{
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    padding: 10px;
    background: conic-gradient(from 180deg, #7c6224, var(--gold), #f1e0ad, var(--gold), #7c6224);
    box-shadow: 0 18px 50px -12px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.03);
  }

  .wheel-inner{
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--bg);
    overflow: hidden;
  }

  #wheel{
    display: block;
    width: 100%;
    height: 100%;
    transform: rotate(0deg);
    transition: transform 4.4s cubic-bezier(.14,.85,.15,1);
    will-change: transform;
  }

  .seg-text{
    fill: var(--gold-light);
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 11.5px;
  }

  #hub{
    position: absolute;
    width: 27%;
    height: 27%;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 30%, #223c5c, #0f1e30 75%);
    box-shadow: 0 0 0 2px rgba(198,161,91,0.55), 0 10px 24px -8px rgba(0,0,0,0.7);
    color: var(--gold-light);
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: clamp(13px, 3.4vw, 16px);
    letter-spacing: 0.01em;
    cursor: pointer;
    z-index: 6;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  #hub:active{ transform: scale(0.94); }
  #hub[disabled]{
    cursor: default;
    opacity: 0.75;
  }
  #hub .hub-label{ pointer-events: none; }

  .hint{
    margin-top: 22px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }

  .result-card{
    width: 100%;
    margin-top: 18px;
    border-radius: 18px;
    padding: 22px 20px;
    background: linear-gradient(160deg, var(--card), #0d1c2e);
    border-left: 3px solid var(--gold);
    box-shadow: 0 20px 40px -18px rgba(0,0,0,0.7);
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    transition: opacity .5s ease, transform .5s ease;
  }
  .result-card.show{
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .result-label{
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gold);
    margin: 0 0 10px;
  }

  .result-row{
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .result-quote{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(19px, 5.2vw, 22px);
    line-height: 1.42;
    color: var(--cream);
    margin: 0;
    flex: 1;
  }

  .copy-btn{
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(198,161,91,0.45);
    background: rgba(198,161,91,0.08);
    color: var(--gold-light);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background .2s ease, transform .15s ease, border-color .2s ease;
  }
  .copy-btn:active{ transform: scale(0.92); }
  .copy-btn svg{ width: 17px; height: 17px; display: block; }
  .copy-btn.copied{
    background: rgba(198,161,91,0.22);
    border-color: var(--gold);
  }

  .copy-toast{
    display: block;
    margin-top: 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--gold-light);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .25s ease, transform .25s ease;
  }
  .copy-toast.show{
    opacity: 1;
    transform: translateY(0);
  }

  footer{
    margin-top: auto;
    padding-top: 44px;
    text-align: center;
  }
  footer p{
    margin: 0;
    color: var(--muted);
    font-size: 12.5px;
    letter-spacing: 0.02em;
  }
  footer .region{
    color: rgba(140,160,179,0.55);
    font-size: 11px;
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: reduce){
    #wheel{ transition-duration: .3s; }
    .result-card{ transition-duration: .15s; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <span class="badge">Premium Bölge</span>
      <h1>Ankara Bölge 1</h1>
      <p class="sub">Çarkı çevir, günün motivasyon cümlesini keşfet.</p>
    </header>

    <main>
      <div class="wheel-wrap">
        <div class="pointer">
          <svg viewBox="0 0 30 34" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 34 L1 6 Q15 -3 29 6 Z" fill="url(#ptGrad)"/>
            <defs>
              <linearGradient id="ptGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#F1E0AD"/>
                <stop offset="1" stop-color="#C6A15B"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="wheel-ring">
          <div class="wheel-inner">
            <svg id="wheel" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </div>
        <button id="hub" aria-label="Çarkı çevir">
          <span class="hub-label">Çevir</span>
        </button>
      </div>

      <p class="hint" id="hint">Ortadaki düğmeye dokun</p>

      <div class="result-card" id="resultCard">
        <p class="result-label">Bugünün motivasyonu</p>
        <div class="result-row">
          <p class="result-quote" id="resultQuote">—</p>
          <button class="copy-btn" id="copyBtn" aria-label="Cümleyi kopyala" type="button">
            <svg id="copyIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="12" height="12" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg id="checkIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>
        <span class="copy-toast" id="copyToast">Kopyalandı</span>
      </div>
    </main>

    <footer>
      <p>Agesa Hayat ve Emeklilik</p>
      <p class="region">Ankara Bölge 1 · Premium Bölge</p>
    </footer>
  </div>

<script>
(function(){
  const quotes = [
    "Bugün bir adım daha at, hedeflerine bir adım daha yaklaş.",
    "Premium bölgede olmak bir ayrıcalık, fark yaratmak senin elinde.",
    "Her görüşme, başarı hikâyenin yeni bir satırı.",
    "Bugün vazgeçme; belki de aradığın “evet” bir sonraki görüşmede.",
    "Hedefler büyük olabilir, ama her büyük başarı küçük bir adımla başlar.",
    "Müşterine değer kattığın her an, kendi değerini de büyütürsün.",
    "Enerjini yükselt, hedefini hatırla, harekete geç.",
    "Bugünün disiplini, yarının başarısını hazırlar.",
    "Bir telefon, bir görüşme, bir fırsat… Başlamak için yeter.",
    "Başarı tesadüf değil; her gün verilen küçük kararların sonucudur.",
    "Bölge 1’in enerjisi yüksek, hedefleri büyük. Bugün sıra sende!",
    "Her müşterinin bir ihtiyacı var; senin görevin onu doğru dinlemek.",
    "Rakamların arkasında insanlar var. İnsanlara dokundukça fark yaratırsın.",
    "Bugün kendine yatırım yap, yarın sonuçlarını izle.",
    "Hayırları kişisel alma; onları başarı yolundaki basamaklara dönüştür.",
    "Günün ilk adımı motivasyon, ikinci adımı aksiyon!",
    "Hedefini sadece görmek yetmez; bugün ona doğru bir adım at.",
    "Birlikte daha güçlüyüz, birlikte daha yükseğe!",
    "Bugün dünden daha iyi ol. Gerisini istikrar halleder.",
    "Bölge 1 Premium’da sıradan bir gün yok. Bugün farkını ortaya koy!"
    "İçindeki güce inan, bugün kendi sınırlarını aş."
    "Düşlediğin hayat, cesaret ettiğin an başlar."
    "Her sabah yeni bir şans, her adım yeni bir başlangıçtır."
    "Başarı, pes etmeyi reddedenlerin yazdığı bir hikayedir."
    "Zorluklar seni durdurmak için değil, ne kadar istediğini görmek için var."
    "En karanlık gece bile güneşe boyun eğer; sadece ilerlemeye devam et."
    "Büyük sıçramalar, küçücük ama kararlı adımlarla gerçekleşir."
    "Dünün keşkelerini bırak, bugünün iyikilerini inşa et."
    "Kendi potansiyelinin farkına var ve bugün parlamaya başla."
    "Mazeretler sadece zaman çalar; harekete geç ve geleceğini şekillendir."
    "Kendini hazırla bugün maximumdan giriş geliyor"
  ];

  const N = quotes.length;
  const SLICE = 360 / N;
  const cx = 200, cy = 200, R = 196, textR = 128;
  const svgNS = "http://www.w3.org/2000/svg";
  const wheel = document.getElementById('wheel');
  const defs = document.createElementNS(svgNS, 'defs');
  wheel.appendChild(defs);

  function polar(angleDeg, r){
    const rad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }

  function sliceColor(i){
    return i % 2 === 0 ? '#122238' : '#17304A';
  }

  for (let i = 0; i < N; i++){
    const start = i * SLICE;
    const end = start + SLICE;
    const centerAngle = start + SLICE / 2;
    const p1 = polar(start, R);
    const p2 = polar(end, R);

    const path = document.createElementNS(svgNS, 'path');
    const d = `M ${cx} ${cy} L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${R} ${R} 0 0 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} Z`;
    path.setAttribute('d', d);
    path.setAttribute('fill', sliceColor(i));
    path.setAttribute('stroke', 'rgba(198,161,91,0.35)');
    path.setAttribute('stroke-width', '1');
    wheel.appendChild(path);

    // curved text arc — reverse direction on bottom half so text isn't upside down
    const bottomHalf = centerAngle > 90 && centerAngle < 270;
    const t1 = polar(start + 2, textR);
    const t2 = polar(end - 2, textR);
    const arcId = 'arc' + i;
    const arcPath = document.createElementNS(svgNS, 'path');
    let arcD;
    if (bottomHalf){
      arcD = `M ${t2.x.toFixed(2)} ${t2.y.toFixed(2)} A ${textR} ${textR} 0 0 0 ${t1.x.toFixed(2)} ${t1.y.toFixed(2)}`;
    } else {
      arcD = `M ${t1.x.toFixed(2)} ${t1.y.toFixed(2)} A ${textR} ${textR} 0 0 1 ${t2.x.toFixed(2)} ${t2.y.toFixed(2)}`;
    }
    arcPath.setAttribute('d', arcD);
    arcPath.setAttribute('id', arcId);
    arcPath.setAttribute('fill', 'none');
    defs.appendChild(arcPath);

    const text = document.createElementNS(svgNS, 'text');
    text.setAttribute('class', 'seg-text');
    const textPath = document.createElementNS(svgNS, 'textPath');
    textPath.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#' + arcId);
    textPath.setAttribute('href', '#' + arcId);
    textPath.setAttribute('startOffset', '50%');
    textPath.setAttribute('text-anchor', 'middle');
    textPath.textContent = quotes[i];
    text.appendChild(textPath);
    wheel.appendChild(text);
  }

  const hub = document.getElementById('hub');
  const hint = document.getElementById('hint');
  const resultCard = document.getElementById('resultCard');
  const resultQuote = document.getElementById('resultQuote');
  const copyBtn = document.getElementById('copyBtn');
  const copyIcon = document.getElementById('copyIcon');
  const checkIcon = document.getElementById('checkIcon');
  const copyToast = document.getElementById('copyToast');

  let totalRotation = 0;
  let spinning = false;
  let copyTimer = null;

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject){
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try{
        document.execCommand('copy');
        resolve();
      } catch(err){
        reject(err);
      }
      document.body.removeChild(ta);
    });
  }

  copyBtn.addEventListener('click', function(){
    const text = resultQuote.textContent;
    copyText(text).then(function(){
      copyBtn.classList.add('copied');
      copyIcon.style.display = 'none';
      checkIcon.style.display = 'block';
      copyToast.classList.add('show');
      if (copyTimer) clearTimeout(copyTimer);
      copyTimer = setTimeout(function(){
        copyBtn.classList.remove('copied');
        copyIcon.style.display = 'block';
        checkIcon.style.display = 'none';
        copyToast.classList.remove('show');
      }, 1800);
    }).catch(function(){
      copyToast.textContent = 'Kopyalanamadı';
      copyToast.classList.add('show');
      if (copyTimer) clearTimeout(copyTimer);
      copyTimer = setTimeout(function(){
        copyToast.classList.remove('show');
        copyToast.textContent = 'Kopyalandı';
      }, 1800);
    });
  });

  function segmentCenterAngle(i){
    return i * SLICE + SLICE / 2;
  }

  hub.addEventListener('click', function(){
    if (spinning) return;
    spinning = true;
    hub.setAttribute('disabled', 'true');
    hint.textContent = 'Çark dönüyor…';
    resultCard.classList.remove('show');

    const targetIndex = Math.floor(Math.random() * N);
    const jitter = (Math.random() - 0.5) * (SLICE * 0.6);
    const desiredLandedAngle = ((segmentCenterAngle(targetIndex) + jitter) % 360 + 360) % 360;
    const extraSpins = 6 + Math.floor(Math.random() * 2);

    const currentMod = ((totalRotation % 360) + 360) % 360;
    let delta = (360 - desiredLandedAngle) - currentMod;
    delta = ((delta % 360) + 360) % 360;
    const newRotation = totalRotation + delta + extraSpins * 360;

    totalRotation = newRotation;
    wheel.style.transform = `rotate(${totalRotation}deg)`;

    setTimeout(function(){
      spinning = false;
      hub.removeAttribute('disabled');
      hint.textContent = 'Ortadaki düğmeye dokun';
      resultQuote.textContent = quotes[targetIndex];
      resultCard.classList.add('show');
    }, 4500);
  });
})();
</script>
</body>
</html>
